<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HydroVault – Inventory</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <!-- water-drop icon -->
        <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C12 2 4 10.5 4 15a8 8 0 0 0 16 0c0-4.5-8-13-8-13z"/>
        </svg>
        <div class="logo-text">
          <span class="logo-name">HydroVault</span>
          <span class="logo-sub">Inventory Manager</span>
        </div>
      </div>
      <button class="btn btn-primary" id="openAddModal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Product
      </button>
    </div>
  </header>

  <!-- Stats Bar -->
  <div class="stats-bar">
    <div class="stat-card">
      <span class="stat-label">Total SKUs</span>
      <span class="stat-value" id="statTotal">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Units in Stock</span>
      <span class="stat-value" id="statUnits">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Categories</span>
      <span class="stat-value" id="statCategories">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Low Stock (≤10)</span>
      <span class="stat-value stat-warning" id="statLowStock">—</span>
    </div>
  </div>

  <!-- Main Content -->
  <main class="main">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search products, SKU, description…" />
      </div>
      <div class="filter-wrap">
        <label class="filter-label">Category</label>
        <select id="categoryFilter" class="select">
          <option value="All">All</option>
        </select>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" id="gridViewBtn" title="Grid view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </button>
        <button class="view-btn" id="listViewBtn" title="List view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- Product Container -->
    <div id="productContainer" class="product-grid"></div>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state hidden">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C12 2 4 10.5 4 15a8 8 0 0 0 16 0c0-4.5-8-13-8-13z"/></svg>
      <p>No products found</p>
      <span>Try adjusting your search or filters</span>
    </div>
  </main>

  <!-- Add / Edit Modal -->
  <div id="productModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Product</h2>
        <button class="modal-close" id="closeModal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="productForm" class="modal-form">
        <input type="hidden" id="productId" />
        <div class="form-row">
          <div class="form-group">
            <label for="fieldName">Product Name <span class="required">*</span></label>
            <input type="text" id="fieldName" required placeholder="e.g. HydroVault Classic 750ml" />
          </div>
          <div class="form-group">
            <label for="fieldSku">SKU <span class="required">*</span></label>
            <input type="text" id="fieldSku" required placeholder="e.g. HV-SS-001" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="fieldCategory">Category <span class="required">*</span></label>
            <input type="text" id="fieldCategory" required placeholder="e.g. Stainless Steel Bottles" list="categoryList" />
            <datalist id="categoryList"></datalist>
          </div>
          <div class="form-group">
            <label for="fieldPrice">Price ($) <span class="required">*</span></label>
            <input type="number" id="fieldPrice" required min="0" step="0.01" placeholder="0.00" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="fieldQuantity">Quantity <span class="required">*</span></label>
            <input type="number" id="fieldQuantity" required min="0" placeholder="0" />
          </div>
          <div class="form-group">
            <label for="fieldDescription">Description</label>
            <input type="text" id="fieldDescription" placeholder="Short product description…" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelModal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="modal-overlay hidden">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Delete Product</h2>
        <button class="modal-close" id="closeDeleteModal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <p class="delete-message">Are you sure you want to delete <strong id="deleteProductName"></strong>? This cannot be undone.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelDelete">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
